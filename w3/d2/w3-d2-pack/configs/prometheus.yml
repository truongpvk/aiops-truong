global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "app-services"
    static_configs:
      - targets:
          - "frontend:8080"
          - "api-gateway:8080"
          - "payment-svc:8080"
          - "inventory-svc:8080"
          - "notification-svc:8080"
          - "checkout-svc:8080"
          - "auth-svc:8080"
        labels:
          tier: "app"

  - job_name: "infra-services"
    static_configs:
      - targets:
          - "payment-db:8080"
          - "inventory-db:8080"
          - "cache-svc:8080"
          - "log-collector:8080"
          - "dns-resolver:8080"
        labels:
          tier: "infra"

  - job_name: "aiops-pipeline"
    static_configs:
      - targets:
          - "aiops-pipeline:8000"
        labels:
          tier: "platform"
