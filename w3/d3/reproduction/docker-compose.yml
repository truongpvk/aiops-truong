version: "3.8"

services:
  # Simulates Cloudflare edge server running WAF rules
  edge-server:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - WAF_ENABLED=true
      - EVIL_REGEX_DEPLOYED=false   # inject.sh sets this to true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - edge-net

  # Prometheus for metric scraping
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - edge-net

networks:
  edge-net: {}
